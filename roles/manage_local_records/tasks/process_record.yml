---
# Determine if A/AAAA record needs a change
- name: Check if host record exists in current config
  ansible.builtin.set_fact:
    record_exists: "{{ record.name in current_hosts_dict and record.type in (current_hosts_dict[record.name] | default({})) }}"
    existing_ip: ""
    needs_change: false
  when: record.type in ['A', 'AAAA']

- name: Get existing IP for host record
  ansible.builtin.set_fact:
    existing_ip: "{{ current_hosts_dict[record.name][record.type] }}"
  when:
    - record.type in ['A', 'AAAA']
    - record_exists | bool

- name: Determine if host record change is needed (present)
  ansible.builtin.set_fact:
    needs_change: true
  when:
    - record.type in ['A', 'AAAA']
    - record.state == "present"
    - not (record_exists | bool) or existing_ip != record.data

- name: Determine if host record change is needed (absent)
  ansible.builtin.set_fact:
    needs_change: true
  when:
    - record.type in ['A', 'AAAA']
    - record.state == "absent"
    - record_exists | bool

# Determine if CNAME record needs a change
- name: Check if CNAME record exists in current config
  ansible.builtin.set_fact:
    existing_cname: "{{ current_cnames_dict.get(record.name, {}) }}"
    needs_change: false
  when: record.type == "CNAME"

- name: Determine if CNAME record change is needed (present)
  ansible.builtin.set_fact:
    needs_change: true
  when:
    - record.type == "CNAME"
    - record.state == "present"
    - >
      existing_cname == {} or
      existing_cname.target != record.data or
      (record.ttl is defined and existing_cname.ttl != record.ttl) or
      (record.ttl is not defined and existing_cname.ttl is not none)

- name: Determine if CNAME record change is needed (absent)
  ansible.builtin.set_fact:
    needs_change: true
  when:
    - record.type == "CNAME"
    - record.state == "absent"
    - existing_cname != {}

# Apply changes only when needed
- name: Manage A record
  sbarbett.pihole.local_a_record:
    host: "{{ record.name }}"
    ip: "{{ record.data }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when:
    - record.type == "A"
    - needs_change

- name: Manage AAAA record
  sbarbett.pihole.local_aaaa_record:
    host: "{{ record.name }}"
    ip: "{{ record.data }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when:
    - record.type == "AAAA"
    - needs_change

- name: Manage CNAME record
  sbarbett.pihole.local_cname:
    host: "{{ record.name }}"
    target: "{{ record.data }}"
    ttl: "{{ record.ttl | default(omit) }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when:
    - record.type == "CNAME"
    - needs_change

- name: Log skipped record
  ansible.builtin.debug:
    msg: "Skipping {{ record.type }} record {{ record.name }} - no change needed"
  when: not needs_change
