---
- name: Safety check - refuse to purge when no records are declared
  ansible.builtin.fail:
    msg: >-
      pihole_purge_unmanaged is enabled but pihole_records is empty.
      This would delete ALL records from Pi-hole. Declare at least one
      record or disable purge mode.
  when: pihole_records | length == 0

- name: Build declared A hostnames set
  ansible.builtin.set_fact:
    declared_a_keys: >-
      {{ pihole_records
         | selectattr('state', 'equalto', 'present')
         | selectattr('type', 'equalto', 'A')
         | map(attribute='name')
         | list }}

- name: Build declared AAAA hostnames set
  ansible.builtin.set_fact:
    declared_aaaa_keys: >-
      {{ pihole_records
         | selectattr('state', 'equalto', 'present')
         | selectattr('type', 'equalto', 'AAAA')
         | map(attribute='name')
         | list }}

- name: Build declared CNAME hostnames set
  ansible.builtin.set_fact:
    declared_cname_keys: >-
      {{ pihole_records
         | selectattr('state', 'equalto', 'present')
         | selectattr('type', 'equalto', 'CNAME')
         | map(attribute='name')
         | list }}

- name: Build current A hostnames set
  ansible.builtin.set_fact:
    current_a_hosts: >-
      {{ current_hosts_dict | dict2items
         | selectattr('value.A', 'defined')
         | map(attribute='key')
         | list }}

- name: Build current AAAA hostnames set
  ansible.builtin.set_fact:
    current_aaaa_hosts: >-
      {{ current_hosts_dict | dict2items
         | selectattr('value.AAAA', 'defined')
         | map(attribute='key')
         | list }}

- name: Compute unmanaged A records
  ansible.builtin.set_fact:
    unmanaged_a: >-
      {{ current_a_hosts
         | difference(declared_a_keys)
         | difference(pihole_protected_records)
         | list }}

- name: Compute unmanaged AAAA records
  ansible.builtin.set_fact:
    unmanaged_aaaa: >-
      {{ current_aaaa_hosts
         | difference(declared_aaaa_keys)
         | difference(pihole_protected_records)
         | list }}

- name: Compute unmanaged CNAME records
  ansible.builtin.set_fact:
    unmanaged_cnames: >-
      {{ current_cnames_dict.keys() | list
         | difference(declared_cname_keys)
         | difference(pihole_protected_records)
         | list }}

- name: Display records to be purged
  ansible.builtin.debug:
    msg: >-
      Purging {{ unmanaged_a | length }} A, {{ unmanaged_aaaa | length }} AAAA,
      and {{ unmanaged_cnames | length }} CNAME unmanaged record(s)
      from {{ pihole_instance.name }}
  when: (unmanaged_a | length > 0) or (unmanaged_aaaa | length > 0) or (unmanaged_cnames | length > 0)

- name: Purge unmanaged A records
  sbarbett.pihole.local_a_record:
    host: "{{ item }}"
    ip: "{{ current_hosts_dict[item]['A'] }}"
    state: absent
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  loop: "{{ unmanaged_a }}"
  loop_control:
    label: "{{ item }} (A)"

- name: Purge unmanaged AAAA records
  sbarbett.pihole.local_aaaa_record:
    host: "{{ item }}"
    ip: "{{ current_hosts_dict[item]['AAAA'] }}"
    state: absent
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  loop: "{{ unmanaged_aaaa }}"
  loop_control:
    label: "{{ item }} (AAAA)"

- name: Purge unmanaged CNAME records
  sbarbett.pihole.local_cname:
    host: "{{ item }}"
    target: "{{ current_cnames_dict[item]['target'] }}"
    ttl: "{{ current_cnames_dict[item]['ttl'] | default(omit) }}"
    state: absent
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  loop: "{{ unmanaged_cnames }}"
  loop_control:
    label: "{{ item }} (CNAME)"
