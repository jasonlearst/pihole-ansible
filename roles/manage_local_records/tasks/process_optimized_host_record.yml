---
- name: Check if A/AAAA record needs processing
  set_fact:
    existing_ip: "{{ current_hosts_dict.get(record.name, None) }}"
    needs_change: false

- name: Determine if change is needed for present state
  set_fact:
    needs_change: true
  when:
    - record.state == "present"
    - existing_ip is none or existing_ip != record.data

- name: Determine if change is needed for absent state
  set_fact:
    needs_change: true
  when:
    - record.state == "absent"
    - existing_ip is not none

- name: Process A record change
  jasonlearst.pihole.local_a_record:
    host: "{{ record.name }}"
    ip: "{{ record.data }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when:
    - needs_change
    - record.type == "A"

- name: Process AAAA record change
  jasonlearst.pihole.local_aaaa_record:
    host: "{{ record.name }}"
    ip: "{{ record.data }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when:
    - needs_change
    - record.type == "AAAA"

- name: Log skipped record
  ansible.builtin.debug:
    msg: "Skipping {{ record.type }} record {{ record.name }} - no change needed"
  when: not needs_change