---
- name: Check if CNAME record needs processing
  set_fact:
    existing_cname: "{{ current_cnames_dict.get(record.name, {}) }}"
    needs_change: false

- name: Determine if change is needed for present state
  set_fact:
    needs_change: true
  when: 
    - record.state == "present"
    - >
      existing_cname == {} or 
      existing_cname.target != record.data or
      (record.ttl is defined and existing_cname.ttl != record.ttl) or
      (record.ttl is not defined and existing_cname.ttl is not none)

- name: Determine if change is needed for absent state  
  set_fact:
    needs_change: true
  when:
    - record.state == "absent"
    - existing_cname != {}

- name: Process CNAME record change
  sbarbett.pihole.local_cname:
    host: "{{ record.name }}"
    target: "{{ record.data }}"
    ttl: "{{ record.ttl | default(omit) }}"
    state: "{{ record.state }}"
    url: "{{ pihole_instance.name }}"
    password: "{{ pihole_instance.password }}"
  when: needs_change

- name: Log skipped CNAME record
  ansible.builtin.debug:
    msg: "Skipping CNAME record {{ record.name }} - no change needed"
  when: not needs_change